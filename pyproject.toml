[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoice-operations-automation"
version = "1.0.0"
description = "A safe, auditable reconciliation pipeline for invoice operations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-auth>=2.40,<3",
  "gspread>=6.2,<7",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "requests>=2.32,<3",
  "tenacity>=9.1,<10",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-requests>=2.32,<3",
]

[project.scripts]
invoice-ops = "invoice_ops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_ops"]

[tool.pytest.ini_options]
addopts = "-q --cov=invoice_ops --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["invoice_ops"]
